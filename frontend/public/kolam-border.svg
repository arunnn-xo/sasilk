<svg xmlns="http://www.w3.org/2000/svg" width="80" height="110" viewBox="0 0 80 110">
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Almond 1 (Centered at x=0) -->
    <path d="M -20,55 C -10,45 10,45 20,55 C 10,65 -10,65 -20,55" />
    <circle cx="0" cy="55" r="1.5" fill="#FFFFFF" stroke="none" />
    
    <!-- Almond 2 (Centered at x=40) -->
    <path d="M 20,55 C 30,45 50,45 60,55 C 50,65 30,65 20,55" />
    <circle cx="40" cy="55" r="1.5" fill="#FFFFFF" stroke="none" />
    
    <!-- Almond 3 (Centered at x=80) -->
    <path d="M 60,55 C 70,45 90,45 100,55 C 90,65 70,65 60,55" />
    <circle cx="80" cy="55" r="1.5" fill="#FFFFFF" stroke="none" />

    <!-- ======================= -->
    <!-- Joint 1 at x=20 -->
    <!-- ======================= -->
    <!-- Top Tall Peak -->
    <path d="M 20,55 C 30,40 30,30 20,15 C 10,30 10,40 20,55" />
    <circle cx="20" cy="35" r="2.5" fill="#FFFFFF" stroke="none" />
    <path d="M 20,15 C 26,5 24,2 20,2 C 16,2 14,5 20,15" />
    <circle cx="20" cy="9" r="2.5" fill="#FFFFFF" stroke="none" />
    
    <!-- Bottom Medium Peak -->
    <path d="M 20,55 C 30,70 30,90 20,95 C 10,90 10,70 20,55" />
    <circle cx="20" cy="75" r="2.5" fill="#FFFFFF" stroke="none" />

    <!-- ======================= -->
    <!-- Joint 2 at x=60 -->
    <!-- ======================= -->
    <!-- Top Medium Peak -->
    <path d="M 60,55 C 70,40 70,20 60,15 C 50,20 50,40 60,55" />
    <circle cx="60" cy="35" r="2.5" fill="#FFFFFF" stroke="none" />
    
    <!-- Bottom Tall Peak -->
    <path d="M 60,55 C 70,70 70,80 60,95 C 50,80 50,70 60,55" />
    <circle cx="60" cy="75" r="2.5" fill="#FFFFFF" stroke="none" />
    <path d="M 60,95 C 66,105 64,108 60,108 C 56,108 54,105 60,95" />
    <circle cx="60" cy="101" r="2.5" fill="#FFFFFF" stroke="none" />

  </g>
</svg>
